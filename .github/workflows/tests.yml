name: Build and tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and test tools
        run: python -m pip install ".[web,dev]" build
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m build --wheel
      - name: Install built wheel
        run: python -I -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed package
        run: python -I tests/smoke_installed_package.py -v
