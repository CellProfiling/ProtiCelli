[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proticelli"
version = "0.1.0"
description = "ProtiCelli: Protein Visual Language Model for microscopy image generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Huangqingbo (Paul) Sun", email = "sunh@stanford.edu"},
]

dependencies = [
    "torch>=2.0,<2.9",
    "diffusers>=0.30,<0.37",
    "accelerate>=0.20.0",
    "transformers",
    "tifffile",
    "numpy",
    "pandas",
    "scipy",
    "tqdm",
    "Pillow",
    "certifi>=2024.0.0",
    "torchvision",
    "timm",
    "packaging",
    "matplotlib",
    "scikit-image",
]

[project.optional-dependencies]
train = [
    "tensorboard",
    "wandb",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[project.scripts]
proticelli-web = "proticelli_web.cli:main"

[tool.setuptools.packages.find]
include = ["proticelli*", "proticelli_web*"]

[tool.setuptools.package-data]
"proticelli.data" = ["*.pkl"]
"proticelli_web" = ["static/*"]
